<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<button id="chatbot-icon" class="chatbot-icon" aria-label="Open AI chatbot">💬</button>
<main id="chatbot-container" class="chatbot-container hidden">
<header class="chatbot-header">
<div><p class="eyebrow">AI ASSISTANT</p><h1>Chatbot</h1></div>
<button id="close-btn" class="icon-btn" aria-label="Close chatbot">&times;</button>
</header>
<section id="chatbot-messages" class="chatbot-messages" aria-live="polite">
<div class="message assistant-message"><div class="message-bubble">Hi! I'm your AI assistant. Ask me anything.</div></div>
</section>
<div id="typing-indicator" class="typing hidden"><span></span><span></span><span></span></div>
<form id="chatbot-form" class="chatbot-input-container">
<input id="chatbot-input" type="text" placeholder="Ask anything..." autocomplete="off" maxlength="12000">
<button id="send-btn" type="submit">Send</button>
</form>
</main>
<script src="./script.js"></script>
</body>
</html>
